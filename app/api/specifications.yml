openapi: 3.0.0
info:
  title: APP-X-X-X API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  # parameters:
  #   X-API-Key:
  #     name: X-API-Key
  #     in: header
  #     description: API key for authentication
  #     required: true
  #     schema:
  #       type: string
  #       example: RAHASIA
  # schemas:
  #   user_id:
  #     type: string
