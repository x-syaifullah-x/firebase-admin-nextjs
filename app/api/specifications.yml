  #       email:
  #         type: string
  #         format: email
  #         example: "xxx@example.com"
  #     required:
  #       - username
  #       - email
paths:
  /users:
    post:
      summary: Register a new user
      description: Creates a user and returns their ID on success.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  format: "text"
                  example: "x-xxx"
              required:
                - username
      responses:
        200:
          description: User was successfully registered
      #     content:
      #       application/json:
      #         schema:
